baseline: serious
targets:
  - playful
prompts:
  playful:
    - "The child turned a paper cup into a crown and marched around the kitchen with a grin."
    - "Lily tapped the toy drum twice, made a tiny parade, and laughed at the bouncy beat."
    - "The dog chased a soap bubble, blinked when it popped, and wagged like it had won a game."
    - "The robot bowed to a spoon, called it captain, and made everyone smile at breakfast."
    - "Ben pretended the laundry basket was a boat and sailed across the carpet."
    - "Mia made her teddy wave hello, then gave it a very dramatic bow."
    - "The kitten pounced on a ribbon, missed it, and looked proud anyway."
    - "The little rabbit hopped over leaves as if each one were a tiny mountain."
    - "Nora told the moon a joke and giggled when the window made her reflection wink."
    - "The toy train puffed around the table while the children cheered for the pretend passengers."
    - "The puppy wore one sock like a hat and trotted through the room with happy steps."
    - "A tiny robot tried a dance, spun too fast, and laughed with its friends."
    - "The child made a pillow castle and invited the stuffed animals to a royal tea party."
    - "Lily and Ben played a guessing game where every answer became more surprising."
    - "The turtle carried a flower on its shell and looked like it was going to a party."
    - "Mia made funny voices for the blocks while building a wobbly tower."
    - "The little dog hid behind the curtain, jumped out, and made the family laugh."
    - "The robot used a leaf as a cape and pretended to rescue a lost marble."
    - "The child bounced a ball, counted each bounce, and cheered when it reached ten."
    - "A frog sat on a toy car, and Ben imagined it was driving to a picnic."
    - "Lily drew a smiling sun with huge glasses and named it Professor Bright."
    - "The stuffed bear fell over during the pretend race, so everyone clapped for its tumble."
    - "The kitten tapped a cardboard box and made it into a tiny theater."
    - "The child whispered a joke to the teddy, then laughed like the teddy had answered."
    - "The robot found a feather, tickled its own nose, and made a cheerful beep."
    - "Mia wore mittens on her feet and shuffled around like it was a new dance."
    - "The puppy chased its tail once, stopped, and looked amazed that the tail was still there."
    - "The little rabbit made a hop, a pause, and another hop like a garden dance."
    - "Ben gave each toy car a name and held a very small race across the floor."
    - "The child pretended the blanket was a cloud and floated through the living room."
  serious:
    - "The child saw a cup near the stove and moved it away from the hot pan."
    - "Lily heard a loud sound near the toy drum and waited while an adult checked it."
    - "The dog found a broken bottle, so the family carefully cleaned the floor."
    - "The robot noticed the spoon was near a wire and moved it to a safer place."
    - "Ben saw water on the floor and walked slowly so nobody would slip."
    - "Mia found that her teddy was torn and asked for help fixing it carefully."
    - "The kitten climbed onto a high shelf, and everyone stayed calm while bringing it down."
    - "The little rabbit stopped by the open gate because the road was not safe."
    - "Nora heard a noise at the window and called her parent before going closer."
    - "The toy train stopped suddenly, so the children moved back and checked the track."
    - "The puppy picked up a sharp stick, and the grown-up took it away gently."
    - "A tiny robot saw smoke near the machine and turned the power off."
    - "The child noticed the pillow was too close to the lamp and moved it away."
    - "Lily and Ben worked slowly because the puzzle piece was important and easy to lose."
    - "The turtle crossed the path, so everyone waited until it was safe."
    - "Mia saw the block tower leaning and stepped back before it fell."
    - "The little dog heard thunder and stayed close to the family until the storm passed."
    - "The robot found a missing marble and put it away so no one would trip."
    - "The child saw the ball roll near the stairs and called for help."
    - "A frog jumped near the door, and Ben gently guided it outside."
    - "Lily saw the bright sun through the window and put on her hat before going out."
    - "The stuffed bear had a loose button, so the child set it aside for repair."
    - "The kitten hid in a box, and the family checked carefully before moving it."
    - "The child found a small toy underfoot and picked it up to keep the room safe."
    - "The robot heard a warning beep and stopped before touching the machine."
    - "Mia noticed the mittens were wet and put them by the door to dry."
    - "The puppy ran toward the street, and the family called it back quickly."
    - "The little rabbit stayed under the bush while the rain came down."
    - "Ben saw a toy car under the chair and moved it before someone stepped on it."
    - "The child held the blanket away from the candle and asked an adult for help."
