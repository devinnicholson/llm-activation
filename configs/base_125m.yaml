project:
  name: llm-activation-base
  seed: 1337

paths:
  raw_glob: data/raw/*.txt
  tokenizer: data/processed/tokenizer.json
  train_data: data/processed/train.npy
  val_data: data/processed/val.npy
  metadata: data/processed/metadata.yaml
  checkpoint_dir: checkpoints/base_125m

tokenizer:
  vocab_size: 32000
  min_frequency: 2

data:
  train_ratio: 0.995

model:
  vocab_size: auto
  context_length: 1024
  num_layers: 12
  num_heads: 12
  d_model: 768
  d_ff: 3072
  rope_theta: 10000.0
  dropout: 0.0
  attention_impl: manual

training:
  batch_size: 8
  gradient_accumulation_steps: 16
  max_iters: 100000
  eval_interval: 1000
  eval_iters: 100
  log_interval: 10
  learning_rate: 0.0006
  min_lr: 0.00006
  warmup_iters: 2000
  lr_decay_iters: 100000
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  always_save_checkpoint: true

system:
  device: auto
  dtype: bfloat16
  compile: true

generation:
  max_new_tokens: 200
  temperature: 0.8
  top_k: 100
