project:
  name: llm-activation-tinystories-60m-overnight
  seed: 1337

paths:
  raw_glob: data/raw/*.txt
  tokenizer: data/processed/tinystories_24m/tokenizer.json
  train_data: data/processed/tinystories_24m/train.npy
  val_data: data/processed/tinystories_24m/val.npy
  metadata: data/processed/tinystories_24m/metadata.yaml
  checkpoint_dir: checkpoints/tinystories_60m_overnight

tokenizer:
  vocab_size: 8192
  min_frequency: 2

data:
  train_ratio: 0.98

model:
  vocab_size: auto
  context_length: 256
  num_layers: 12
  num_heads: 8
  d_model: 512
  d_ff: 2048
  rope_theta: 10000.0
  dropout: 0.1
  attention_impl: manual

training:
  batch_size: 4
  gradient_accumulation_steps: 8
  max_iters: 100000
  eval_interval: 1000
  eval_iters: 20
  log_interval: 50
  learning_rate: 0.0002
  min_lr: 0.00002
  warmup_iters: 1000
  lr_decay_iters: 100000
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  always_save_checkpoint: true

system:
  device: auto
  dtype: bfloat16
  compile: false

generation:
  max_new_tokens: 260
  temperature: 0.8
  top_k: 100
  stop_at_eos: true
