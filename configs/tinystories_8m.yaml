project:
  name: llm-activation-tinystories-8m
  seed: 1337

paths:
  raw_glob: data/raw/*.txt
  tokenizer: data/processed/tinystories_8m/tokenizer.json
  train_data: data/processed/tinystories_8m/train.npy
  val_data: data/processed/tinystories_8m/val.npy
  metadata: data/processed/tinystories_8m/metadata.yaml
  checkpoint_dir: checkpoints/tinystories_8m

tokenizer:
  vocab_size: 4096
  min_frequency: 2

data:
  train_ratio: 0.98

model:
  vocab_size: auto
  context_length: 128
  num_layers: 6
  num_heads: 8
  d_model: 256
  d_ff: 1024
  rope_theta: 10000.0
  dropout: 0.1
  attention_impl: manual

training:
  batch_size: 16
  gradient_accumulation_steps: 8
  max_iters: 2000
  eval_interval: 200
  eval_iters: 20
  log_interval: 20
  learning_rate: 0.0003
  min_lr: 0.00003
  warmup_iters: 100
  lr_decay_iters: 2000
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  always_save_checkpoint: true

system:
  device: auto
  dtype: bfloat16
  compile: false

generation:
  max_new_tokens: 160
  temperature: 0.8
  top_k: 100
